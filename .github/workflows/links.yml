name: links

# Weekly: every URL in the README must still answer. A failure opens (or
# updates) one issue instead of failing silently in the Actions tab.
on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --user-agent "awesome-market-data link check ${{ vars.LINK_CHECK_CONTACT }}" README.md
          fail: false
      - if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links
          content-filepath: ./lychee/out.md
          labels: links
