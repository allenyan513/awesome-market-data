description: Official MCP server for Massive (formerly Polygon.io) with three tools that search endpoints, call any REST API and query results in SQL.
price: freemium
price_note: same plans and limits as the API
auth: key
terms:
  url: https://massive.com/legal/market-data-terms-of-service
