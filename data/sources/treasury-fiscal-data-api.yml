name: Treasury Fiscal Data API
url: https://fiscaldata.treasury.gov/api-documentation/
category: macro
description: REST API for federal finance datasets such as public debt, the Daily Treasury Statement, auctions and average interest rates.
price: free
auth: none
formats: [json, csv, xml]
terms:
  url: https://fiscaldata.treasury.gov/api-documentation/
  store: "yes"
  redistribute: "yes"
  commercial: "yes"
